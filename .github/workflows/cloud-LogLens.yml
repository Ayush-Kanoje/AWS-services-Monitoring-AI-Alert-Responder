name: Cloud-LogLens Deploy

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build React app (Vite creates dist/ folder)
      - name: Build React app
        run: npm run build

      # 5. Copy dist files to EC2
      - name: Deploy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/home/ec2-user/Cloud-LogLens/"
          strip_components: 1

      # 6. Move to Nginx directory and reload
      - name: Update Nginx and reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Moving files to Nginx web root..."
            sudo cp -r /home/ec2-user/Cloud-LogLens/* /var/www/Cloud-LogLens/
            sudo chown -R nginx:nginx /var/www/Cloud-LogLens/
            sudo chmod -R 755 /var/www/Cloud-LogLens/
            
            echo "Testing Nginx config..."
            sudo nginx -t
            
            echo "Reloading Nginx..."
            sudo systemctl reload nginx
            
            echo "Deployment complete!"