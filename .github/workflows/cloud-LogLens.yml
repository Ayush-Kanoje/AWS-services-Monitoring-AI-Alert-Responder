name: Cloud-LogLens Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Upload build to S3
        run: aws s3 sync dist/ s3://cloud-loglens-deploy-artifacts/latest/ --delete

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws s3 sync s3://cloud-loglens-deploy-artifacts/latest/ /var/www/Cloud-LogLens/ --delete","sudo chown -R nginx:nginx /var/www/Cloud-LogLens","sudo chmod -R 755 /var/www/Cloud-LogLens","sudo nginx -t","sudo systemctl reload nginx"]' \
            --comment "Deploy Cloud-LogLens" \
            --output text \
            --query 'Command.CommandId')

          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for SSM command completion
        run: |
          echo "Waiting for SSM command $command_id to complete..."
          aws ssm wait command-executed --command-id "$command_id" --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
          
          echo "Command completed. Checking status..."
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --output table